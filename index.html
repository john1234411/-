<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>오늘의 명언 | Daily Quotes</title>
  <style>
    :root {
      --bg: #f7f3ec;
      --paper: #fffdf9;
      --ink: #39342f;
      --muted: #8b8176;
      --accent: #8a7562;
      --accent-dark: #6f5c4b;
      --line: #e9e1d7;
      --soft: #f0e9df;
      --shadow: 0 14px 40px rgba(72, 56, 39, .08);
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      background: var(--bg);
      color: var(--ink);
      font-family: "Pretendard", "Noto Sans KR", system-ui, sans-serif;
      line-height: 1.6;
    }
    button { font: inherit; cursor: pointer; }
    .wrap { width: min(980px, calc(100% - 36px)); margin: 0 auto; }
    header { padding: 28px 0 18px; display: flex; justify-content: space-between; align-items: center; }
    .brand { font-size: 15px; font-weight: 800; letter-spacing: .16em; color: var(--accent-dark); }
    .date { font-size: 13px; color: var(--muted); }
    .hero { text-align: center; padding: 54px 22px 46px; }
    .eyebrow { color: var(--accent); font-size: 12px; letter-spacing: .22em; font-weight: 700; }
    h1 { font-size: clamp(32px, 6vw, 52px); line-height: 1.2; margin: 12px 0 10px; letter-spacing: -.05em; }
    .intro { color: var(--muted); margin: 0; font-size: 15px; }
    .quote-card {
      max-width: 760px; margin: 0 auto; padding: clamp(30px, 6vw, 58px);
      background: var(--paper); border: 1px solid var(--line); border-radius: 24px;
      box-shadow: var(--shadow); text-align: center; position: relative;
    }
    .quote-mark { font-family: Georgia, serif; color: #c9b8a5; font-size: 54px; line-height: .8; }
    #quoteText { font-size: clamp(21px, 3.5vw, 30px); font-weight: 650; line-height: 1.65; letter-spacing: -.035em; margin: 18px auto 15px; max-width: 620px; word-break: keep-all; }
    #quoteAuthor { color: var(--muted); font-size: 14px; }
    .actions { display: flex; flex-wrap: wrap; gap: 10px; justify-content: center; margin-top: 28px; }
    .btn { border: 1px solid var(--line); border-radius: 999px; padding: 11px 18px; background: white; color: var(--ink); transition: .2s; }
    .btn:hover { transform: translateY(-2px); border-color: #cbb9a7; }
    .btn.primary { background: var(--accent); border-color: var(--accent); color: white; }
    .btn.primary:hover { background: var(--accent-dark); }
    .btn.active { color: #9c665e; border-color: #d8b8b2; background: #fff8f6; }
    .section { padding: 48px 0 60px; }
    .section-head { display: flex; align-items: end; justify-content: space-between; gap: 16px; margin-bottom: 18px; }
    h2 { font-size: 22px; margin: 0; letter-spacing: -.04em; }
    .sub { color: var(--muted); font-size: 13px; margin: 5px 0 0; }
    .tabs { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 20px; }
    .tab { padding: 8px 15px; border-radius: 999px; border: 1px solid var(--line); background: transparent; color: var(--muted); font-size: 13px; }
    .tab.selected { background: var(--ink); color: white; border-color: var(--ink); }
    .grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 14px; }
    .item { padding: 22px; background: var(--paper); border: 1px solid var(--line); border-radius: 17px; }
    .item .tag { font-size: 11px; color: var(--accent); font-weight: 700; }
    .item p { font-size: 16px; font-weight: 600; margin: 10px 0; word-break: keep-all; }
    .item .author { color: var(--muted); font-size: 12px; }
    .item-foot { display: flex; justify-content: space-between; align-items: center; margin-top: 16px; }
    .mini { border: 0; background: var(--soft); color: var(--accent-dark); border-radius: 999px; padding: 7px 11px; font-size: 12px; }
    .empty { grid-column: 1 / -1; text-align: center; padding: 42px 15px; border: 1px dashed #d9cec1; border-radius: 17px; color: var(--muted); }
    footer { border-top: 1px solid var(--line); text-align: center; color: var(--muted); padding: 24px 0 34px; font-size: 12px; }
    .toast { position: fixed; left: 50%; bottom: 24px; transform: translate(-50%, 20px); opacity: 0; pointer-events: none; background: #39342f; color: white; padding: 10px 16px; border-radius: 999px; font-size: 13px; transition: .25s; }
    .toast.show { opacity: 1; transform: translate(-50%, 0); }
    @media (max-width: 620px) {
      header { padding-top: 20px; }
      .hero { padding: 40px 8px 32px; }
      .grid { grid-template-columns: 1fr; }
      .section-head { align-items: start; flex-direction: column; }
      .quote-card { border-radius: 19px; }
    }
  </style>
</head>
<body>
  <div class="wrap">
    <header>
      <div class="brand">DAILY QUOTES</div>
      <div class="date" id="todayDate"></div>
    </header>

    <main>
      <section class="hero">
        <div class="eyebrow">A LITTLE INSPIRATION</div>
        <h1>오늘의 명언</h1>
        <p class="intro">하루를 바꾸는 작은 문장 하나를 만나보세요.</p>
      </section>

      <section class="quote-card" aria-live="polite">
        <div class="quote-mark">“</div>
        <p id="quoteText">작은 일에도 최선을 다하면 큰 결과가 따라온다.</p>
        <div id="quoteAuthor">— 오늘의 문장</div>
        <div class="actions">
          <button class="btn primary" id="randomBtn">새로운 명언 보기 ↗</button>
          <button class="btn" id="favoriteBtn" aria-pressed="false">♡ 즐겨찾기</button>
          <button class="btn" id="copyBtn">명언 복사</button>
        </div>
      </section>

      <section class="section">
        <div class="section-head">
          <div>
            <h2 id="listTitle">명언 모아보기</h2>
            <p class="sub">마음에 드는 문장을 골라보세요.</p>
          </div>
          <button class="btn" id="favoritesViewBtn">♡ 즐겨찾기 모아보기</button>
        </div>
        <nav class="tabs" id="tabs" aria-label="명언 카테고리">
          <button class="tab selected" data-category="전체">전체</button>
          <button class="tab" data-category="성공">성공</button>
          <button class="tab" data-category="노력">노력</button>
          <button class="tab" data-category="행복">행복</button>
          <button class="tab" data-category="용기">용기</button>
        </nav>
        <div class="grid" id="quoteList"></div>
      </section>
    </main>

    <footer>DAILY QUOTES · 오늘도 당신에게 작은 영감이 닿기를</footer>
  </div>
  <div class="toast" id="toast" role="status"></div>

  <script>
    const quotes = [
      { text: "시작이 반이다.", author: "아리스토텔레스", category: "성공" },
      { text: "천 리 길도 한 걸음부터 시작된다.", author: "노자", category: "노력" },
      { text: "행복은 습관이다. 그것을 몸에 지니라.", author: "허버드", category: "행복" },
      { text: "할 수 있다고 믿는 사람은 결국 그렇게 된다.", author: "샤를 드골", category: "용기" },
      { text: "성공은 매일 반복한 작은 노력들의 합이다.", author: "로버트 콜리어", category: "성공" },
      { text: "오늘 걷지 않으면 내일은 뛰어야 한다.", author: "도스토옙스키에게 귀속되는 문구", category: "노력" },
      { text: "가장 어두운 밤도 끝나고 해는 떠오른다.", author: "빅토르 위고", category: "용기" },
      { text: "행복은 목적지가 아니라 여행하는 방식이다.", author: "마거릿 리 런벡", category: "행복" },
      { text: "위대한 일은 작은 일들이 모여 이루어진다.", author: "빈센트 반 고흐", category: "성공" },
      { text: "넘어지는 것은 실패가 아니다. 다시 일어나지 않는 것이 실패다.", author: "메리 픽퍼드", category: "용기" },
      { text: "꾸준함은 재능을 이기는 힘이 된다.", author: "오늘의 문장", category: "노력" },
      { text: "자신을 믿는 순간, 가능성은 시작된다.", author: "오늘의 문장", category: "용기" }
    ];

    const $ = (id) => document.getElementById(id);
    let currentQuote = quotes[0];
    let currentCategory = "전체";
    let favoritesOnly = false;
    let favorites = JSON.parse(localStorage.getItem("dailyQuoteFavorites") || "[]");

    $("todayDate").textContent = new Intl.DateTimeFormat("ko-KR", {
      year: "numeric", month: "long", day: "numeric", weekday: "long"
    }).format(new Date());

    function showToast(message) {
      $("toast").textContent = message;
      $("toast").classList.add("show");
      clearTimeout(showToast.timer);
      showToast.timer = setTimeout(() => $("toast").classList.remove("show"), 1900);
    }

    function renderCurrent() {
      $("quoteText").textContent = currentQuote.text;
      $("quoteAuthor").textContent = "— " + currentQuote.author;
      const saved = favorites.includes(currentQuote.text);
      $("favoriteBtn").textContent = saved ? "♥ 저장됨" : "♡ 즐겨찾기";
      $("favoriteBtn").classList.toggle("active", saved);
      $("favoriteBtn").setAttribute("aria-pressed", String(saved));
    }

    function renderList() {
      const list = quotes.filter(q => {
        const categoryMatch = currentCategory === "전체" || q.category === currentCategory;
        const favoriteMatch = !favoritesOnly || favorites.includes(q.text);
        return categoryMatch && favoriteMatch;
      });
      $("listTitle").textContent = favoritesOnly ? "즐겨찾기한 명언" : "명언 모아보기";
      $("favoritesViewBtn").textContent = favoritesOnly ? "전체 명언 보기" : "♡ 즐겨찾기 모아보기";
      $("quoteList").innerHTML = "";
      if (!list.length) {
        $("quoteList").innerHTML = '<div class="empty">아직 저장한 명언이 없어요.<br>마음에 드는 명언을 즐겨찾기 해보세요.</div>';
        return;
      }
      list.forEach(q => {
        const card = document.createElement("article");
        card.className = "item";
        const tag = document.createElement("div");
        tag.className = "tag";
        tag.textContent = q.category;
        const quote = document.createElement("p");
        quote.textContent = "“" + q.text + "”";
        const author = document.createElement("div");
        author.className = "author";
        author.textContent = "— " + q.author;
        const foot = document.createElement("div");
        foot.className = "item-foot";
        const select = document.createElement("button");
        select.className = "mini";
        select.textContent = "이 명언 보기";
        select.addEventListener("click", () => {
          currentQuote = q;
          renderCurrent();
          window.scrollTo({ top: 0, behavior: "smooth" });
        });
        const save = document.createElement("button");
        save.className = "mini";
        save.textContent = favorites.includes(q.text) ? "♥ 저장됨" : "♡ 저장";
        save.addEventListener("click", () => toggleFavorite(q));
        foot.append(select, save);
        card.append(tag, quote, author, foot);
        $("quoteList").append(card);
      });
    }

    function toggleFavorite(q) {
      if (favorites.includes(q.text)) {
        favorites = favorites.filter(text => text !== q.text);
        showToast("즐겨찾기에서 삭제했어요.");
      } else {
        favorites.push(q.text);
        showToast("즐겨찾기에 저장했어요.");
      }
      localStorage.setItem("dailyQuoteFavorites", JSON.stringify(favorites));
      renderCurrent();
      renderList();
    }

    $("randomBtn").addEventListener("click", () => {
      const choices = quotes.filter(q => q.text !== currentQuote.text);
      currentQuote = choices[Math.floor(Math.random() * choices.length)];
      renderCurrent();
    });
    $("favoriteBtn").addEventListener("click", () => toggleFavorite(currentQuote));
    $("copyBtn").addEventListener("click", async () => {
      const text = `“${currentQuote.text}” — ${currentQuote.author}`;
      try {
        await navigator.clipboard.writeText(text);
        showToast("명언을 복사했어요!");
      } catch {
        showToast("복사를 지원하지 않는 환경이에요.");
      }
    });
    $("favoritesViewBtn").addEventListener("click", () => {
      favoritesOnly = !favoritesOnly;
      renderList();
    });
    $("tabs").addEventListener("click", e => {
      const button = e.target.closest("[data-category]");
      if (!button) return;
      currentCategory = button.dataset.category;
      favoritesOnly = false;
      document.querySelectorAll(".tab").forEach(tab => tab.classList.toggle("selected", tab === button));
      renderList();
    });

    renderCurrent();
    renderList();
  </script>
</body>
</html>
